name: Daily Learning Log

on:
  schedule:
    # Запускать каждый день в 16:00 по МСК (13:00 UTC)
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create daily log file
        run: |
          mkdir -p Journal
          TODAY=$(date +"%d-%m-%Y")
          FILE="Journal/${TODAY}.md"
          if [ ! -f "$FILE" ]; then
            echo "# 📅 ${TODAY} - День обучения" > "$FILE"
            echo "" >> "$FILE"
            echo "## Что изучил сегодня:" >> "$FILE"
            echo "- " >> "$FILE"
            echo "" >> "$FILE"
            echo "## Практика:" >> "$FILE"
            echo "- " >> "$FILE"
          fi
          echo "" >> "$FILE"
          echo "✅ День отмечен $(date '+%H:%M')" >> "$FILE"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull origin main --rebase || true
          git add Journal/
          git diff --staged --quiet || git commit -m "Daily log: $(date '+%Y-%m-%d')"
          git push
